services:
  sanda-mail:
    build: .
    restart: unless-stopped
    ports:
      # SANDA_MAIL_BIND=127.0.0.1 → nur über den Reverse-Proxy erreichbar
      - "${SANDA_MAIL_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    volumes:
      - sanda-mail-daten:/data

volumes:
  sanda-mail-daten:
